# https://gleam.run/writing-gleam/gleam-toml

name = "glintl"
version = "0.0.3"

description = "Format dates and times in many languages, on Erlang and JavaScript."
licences = ["MIT"]
repository = { type = "github", user = "alii", repo = "glintl" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
# Generator uses Bun ICU, so we test against Bun for consistency
runtime = "bun"
